<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex練習サイト</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="hero">
    <div class="card">
      <p class="label">Codex Practice</p>
      <h1>はじめてのCodex練習サイト</h1>
      <p class="description">
        このページは、GitHubとChatGPTを使ってWebサイトの修正を練習するためのサンプルサイトです。
      </p>
      <section class="practice-list">
        <h2>このサイトで練習できること</h2>
        <ul>
          <li>GitHubのファイルを確認する</li>
          <li>ChatGPTでコードの修正案を出す</li>
          <li>変更後のページをブラウザで確認する</li>
        </ul>
      </section>
      <a class="button" href="https://chatgpt.com/" target="_blank" rel="noreferrer">練習を開始する</a>
